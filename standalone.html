<html lang="zh-CN">
<head>

<title>点球大赛 Tanda de Penales · 灰盒</title>

<style>
/* 表现层样式 —— 首版为程序化占位美术。
   按架构约定，整层可在 S3 替换为 Pixi + 视频基座，不影响 shootout-math。 */

:root {
  --bg: #0a1220;
  --panel: #121d2f;
  --panel-2: #18263c;
  --line: #27385440;
  --ink: #e8eef7;
  --dim: #8fa3bd;
  --accent: #38d9a9;
  --accent-2: #4dabf7;
  --warn: #ffd43b;
  --bad: #ff6b6b;
  --grass: #1b7a43;
  --grass-2: #176536;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
    'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  min-height: 100%;
  overscroll-behavior: none;
}

#app {
  max-width: 480px;
  margin: 0 auto;
  padding: 12px 12px 32px;
  min-height: 100vh;
}

/* 桌面：并排两栏 */
@media (min-width: 900px) {
  #app { max-width: 1000px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; padding-top: 20px; }
  #app > .full { grid-column: 1 / -1; }
}

h1 { font-size: 18px; margin: 0 0 2px; letter-spacing: .5px; }
.sub { color: var(--dim); font-size: 12px; margin-bottom: 10px; }

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 12px;
}
.card h2 { font-size: 13px; color: var(--dim); margin: 0 0 8px; font-weight: 600; letter-spacing: .5px; }

/* ---------- HUD ---------- */
.hud { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.hud .box { background: var(--panel-2); border-radius: 9px; padding: 8px 6px; text-align: center; }
.hud .lbl { font-size: 10px; color: var(--dim); letter-spacing: .5px; }
.hud .val { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 1px; }
.hud .val.cash { color: var(--accent); }
.hud .val small { font-size: 11px; color: var(--dim); font-weight: 400; }

.shots { display: flex; gap: 10px; justify-content: center; font-size: 11px; color: var(--dim); margin-top: 8px; }
.pips { display: inline-flex; gap: 3px; vertical-align: middle; margin-left: 4px; }
.pip { width: 8px; height: 8px; border-radius: 50%; background: #2b3d58; }
.pip.goal { background: var(--accent); }
.pip.miss { background: var(--bad); }

/* ---------- 球门 ---------- */
.pitch {
  position: relative;
  height: 190px;
  border-radius: 10px;
  background: linear-gradient(#0f2e1d 0%, var(--grass-2) 42%, var(--grass) 100%);
  overflow: hidden;
  margin-bottom: 10px;
}
.goalframe {
  position: absolute; left: 10%; right: 10%; top: 22px; height: 96px;
  border: 5px solid #e9f2ff; border-bottom-width: 3px; border-radius: 3px;
  background: repeating-linear-gradient(90deg, #ffffff10 0 1px, transparent 1px 11px),
              repeating-linear-gradient(0deg, #ffffff10 0 1px, transparent 1px 11px);
}
.zones { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); }
.zone { border-right: 1px dashed #ffffff22; position: relative; }
.zone:last-child { border-right: none; }
.zone .heat {
  position: absolute; inset: 0;
  background: var(--bad); opacity: 0;
  transition: opacity .3s;
}
.zone .pct {
  position: absolute; bottom: 3px; left: 0; right: 0; text-align: center;
  font-size: 10px; color: #fff; text-shadow: 0 1px 2px #000; font-variant-numeric: tabular-nums;
}
.keeper {
  position: absolute; bottom: 4px; width: 30px; height: 46px;
  background: linear-gradient(#ffd43b, #f59f00);
  border-radius: 7px 7px 4px 4px;
  left: 50%; transform: translateX(-50%);
  transition: left .32s cubic-bezier(.3,1.5,.5,1);
  box-shadow: 0 3px 8px #0006;
  z-index: 2;
}
.keeper::before {
  content: ''; position: absolute; top: -9px; left: 50%; transform: translateX(-50%);
  width: 13px; height: 13px; border-radius: 50%; background: #ffe8a3;
}
.ball {
  position: absolute; width: 17px; height: 17px; border-radius: 50%;
  background: radial-gradient(circle at 32% 30%, #fff 0 42%, #c7d4e4 100%);
  left: 50%; bottom: 8px; transform: translateX(-50%);
  transition: left .40s cubic-bezier(.22,.8,.3,1), bottom .40s cubic-bezier(.22,.8,.3,1),
              transform .40s ease-out;
  box-shadow: 0 2px 6px #0007;
  opacity: 1;
  z-index: 3;
}
.pitch .spot {
  position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
  width: 5px; height: 5px; border-radius: 50%; background: #ffffff66;
}

.banner {
  position: absolute; top: 50%; left: 0; right: 0; transform: translateY(-50%) scale(.82);
  text-align: center; font-size: 30px; font-weight: 800; letter-spacing: 2px;
  text-shadow: 0 2px 14px #000d, 0 0 30px #000a;
  opacity: 0; transition: opacity .18s ease-out, transform .25s cubic-bezier(.2,1.6,.4,1);
  pointer-events: none; z-index: 5;
}
.banner.show { opacity: 1; transform: translateY(-50%) scale(1); }
.banner.good { color: var(--accent); }
.banner.bad { color: var(--bad); }

/* ---------- 线索 / 关键球 ---------- */
.hint {
  background: var(--panel-2); border-left: 3px solid var(--accent-2);
  border-radius: 6px; padding: 7px 10px; font-size: 12.5px; margin-bottom: 8px;
}
.keyball {
  background: #3b2a0f; border-left: 3px solid var(--warn);
  border-radius: 6px; padding: 7px 10px; font-size: 13px; font-weight: 600;
  color: var(--warn); margin-bottom: 8px;
}

/* ---------- 动作按钮 ---------- */
.opts { display: grid; gap: 7px; }
.opts.cols3 { grid-template-columns: repeat(3, 1fr); }
.opt {
  background: var(--panel-2); border: 1px solid var(--line); color: var(--ink);
  border-radius: 9px; padding: 9px 6px; cursor: pointer; text-align: center;
  font: inherit; transition: border-color .15s, background .15s, transform .08s;
}
.opt:hover:not(:disabled) { border-color: var(--accent-2); background: #1d2e49; }
.opt:active:not(:disabled) { transform: scale(.97); }
.opt:disabled { opacity: .45; cursor: not-allowed; }
.opt .dir { font-size: 15px; font-weight: 700; }
.opt .p { font-size: 11px; color: var(--accent-2); font-variant-numeric: tabular-nums; margin-top: 2px; }
.opt .br { font-size: 10px; color: var(--dim); font-variant-numeric: tabular-nums; margin-top: 2px; line-height: 1.35; }
.opt .br b { color: var(--accent); font-weight: 600; }
.opt .br i { color: var(--bad); font-style: normal; }
.opt.allin { border-color: var(--bad); }
.opt.allin .br i { font-weight: 700; }

.typeRow { display: flex; gap: 6px; margin-bottom: 8px; }
.typeRow button {
  flex: 1; background: var(--panel-2); border: 1px solid var(--line); color: var(--dim);
  border-radius: 8px; padding: 7px; font: inherit; font-size: 13px; cursor: pointer;
}
.typeRow button.on { border-color: var(--accent); color: var(--ink); background: #163a30; font-weight: 600; }

/* ---------- 按钮 ---------- */
.btn {
  display: block; width: 100%; padding: 12px; border-radius: 10px; border: none;
  font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px;
}
.btn.primary { background: var(--accent); color: #06231a; }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
.btn.cash { background: var(--warn); color: #2b2000; }
.btn:active { transform: scale(.99); }
.btnRow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btnRow .btn { margin-top: 0; }

/* ---------- 倾向图 ---------- */
.tend { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.tend .t { background: var(--panel-2); border-radius: 7px; padding: 6px 4px; text-align: center; }
.tend .t .d { font-size: 12px; color: var(--dim); }
.tend .t .bar { height: 5px; border-radius: 3px; background: #2b3d58; margin: 4px 0 3px; overflow: hidden; }
.tend .t .bar > span { display: block; height: 100%; background: var(--accent-2); }
.tend .t .v { font-size: 11px; font-variant-numeric: tabular-nums; }
.tend .t.hot .bar > span { background: var(--bad); }

.note { font-size: 11px; color: var(--dim); margin-top: 6px; }

/* ---------- 结算 ---------- */
.result { text-align: center; padding: 6px 0 2px; }
.result .big { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
.result .big.win { color: var(--accent); }
.result .big.lose { color: var(--bad); }
.result .why { color: var(--dim); font-size: 13px; margin-top: 2px; }
.report { font-size: 12.5px; }
.report li { margin-bottom: 5px; color: #c3d2e5; }
.proof { font-size: 10.5px; color: var(--dim); word-break: break-all; margin-top: 8px; line-height: 1.45; }

/* ---------- 下注 ---------- */
.stakes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.stakes button {
  background: var(--panel-2); border: 1px solid var(--line); color: var(--ink);
  border-radius: 8px; padding: 10px 4px; font: inherit; font-size: 14px; cursor: pointer;
  font-variant-numeric: tabular-nums;
}
.stakes button.on { border-color: var(--accent); background: #163a30; font-weight: 700; }

.log { font-size: 11.5px; color: var(--dim); max-height: 150px; overflow-y: auto; font-variant-numeric: tabular-nums; }
.log div { padding: 2px 0; border-bottom: 1px solid #1c2a40; }
.log .g { color: var(--accent); }
.log .b { color: var(--bad); }

.gate { font-size: 11px; color: var(--dim); line-height: 1.6; }
.gate b { color: var(--accent); }
.disclaimer { font-size: 10.5px; color: #6b7d94; margin-top: 10px; line-height: 1.6; }

.tend .t .v .delta { font-size: 10px; margin-left: 3px; font-weight: 700; }
.tend .t .v .delta.up { color: var(--bad); }
.tend .t .v .delta.down { color: var(--accent); }

</style>
</head>

<script>
"use strict";
(function(){

/* ======== src/math/prf.js ======== */
// 带种子的伪随机函数：PRF(seed, 路径) -> [0,1)
//
// 玩家的选择决定读取随机性的哪一条分支，但无法影响任何分支里的数值。
// 同一个 seed + 同一条决策路径必须永远产出同一场比赛。
//
// 服务端接入后，seed 由服务端生成并先下发 hash(seed) 作为承诺；
// 本模块的实现保持不变，以保证客户端可以重放并校验。

/** 把字符串混成一个 32 位整数（xmur3） */
function hashString(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  h = Math.imul(h ^ (h >>> 16), 2246822507);
  h = Math.imul(h ^ (h >>> 13), 3266489909);
  return (h ^= h >>> 16) >>> 0;
}

/** 对 32 位整数再做一轮扩散，避免相邻 key 产生相关序列 */
function scramble(x) {
  x = (x + 0x9e3779b9) >>> 0;
  x = Math.imul(x ^ (x >>> 16), 0x21f0aaad) >>> 0;
  x = Math.imul(x ^ (x >>> 15), 0x735a2d97) >>> 0;
  return (x ^ (x >>> 15)) >>> 0;
}

/**
 * 从 seed 与决策路径导出一个 [0,1) 的值。
 * @param {string} seed
 * @param {string} path 形如 "r1:atk:L-placed" 的路径标识，须包含到当前为止的完整决策链
 * @returns {number}
 */
function prf(seed, path) {
  const a = hashString(`${seed}|${path}`);
  const b = scramble(a);
  // 用 53 位有效精度，避免只取 32 位导致的粒度问题
  const hi = b >>> 5; // 27 bits
  const lo = scramble(b) >>> 6; // 26 bits
  return (hi * 67108864 + lo) / 9007199254740992;
}

/** 生成一个本地 seed（阶段一用；服务端接入后由服务端生成） */
function makeLocalSeed() {
  const bytes = new Uint8Array(16);
  if (typeof globalThis.crypto?.getRandomValues === 'function') {
    globalThis.crypto.getRandomValues(bytes);
  } else {
    for (let i = 0; i < bytes.length; i++) bytes[i] = Math.floor(Math.random() * 256);
  }
  return Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');
}

/**
 * 承诺值。真正的可证明公平需要绑定会话、规则与配置版本以及完整动作日志；
 * 单独的 seed 哈希不证明 seed 生成过程无偏 —— 这里只是阶段一的占位实现。
 */
function commitment(seed) {
  return hashString(`commit|${seed}`).toString(16).padStart(8, '0');
}


/* ======== src/math/rules.js ======== */
// 赛制与终局判定
//
// 常规赛最多 5 轮，每轮玩家先攻后守。平局进入限定骤死赛（最多 3 组）。
// 全场最多 16 个罚球阶段：常规 10 个 + 骤死 6 个。该上限使完整状态求解可行。
const REGULAR_ROUNDS = 5;
const SUDDEN_DEATH_SETS = 3;
const PHASE = { ATTACK: 'attack', DEFEND: 'defend' };
const END = {
  WIN: 'win', // 赢下大战
  LOSS: 'loss', // 常规落败：返还为零
  DRAW: 'draw', // 骤死上限后仍平：按平局返还函数结算
  CASHED: 'cashed', // 玩家主动收钱
};

/** 创建初始比赛状态（不含现金，现金由 engine 维护） */
function initialMatch() {
  return {
    round: 1,
    phase: PHASE.ATTACK,
    playerGoals: 0,
    oppGoals: 0,
    playerTaken: 0,
    oppTaken: 0,
    suddenDeath: false,
    sdSet: 0,
    ended: null, // END.* 或 null
  };
}

/** 常规赛剩余罚球数 */
function regularRemaining(m) {
  return {
    player: Math.max(0, REGULAR_ROUNDS - m.playerTaken),
    opp: Math.max(0, REGULAR_ROUNDS - m.oppTaken),
  };
}

/**
 * 常规赛阶段的提前胜负判定。
 * 玩家胜：已进球数 > 对手已进球数 + 对手剩余次数
 * 玩家负：对手已进球数 > 玩家已进球数 + 玩家剩余次数
 */
function decideRegular(m) {
  const rem = regularRemaining(m);
  if (m.playerGoals > m.oppGoals + rem.opp) return END.WIN;
  if (m.oppGoals > m.playerGoals + rem.player) return END.LOSS;
  if (rem.player === 0 && rem.opp === 0) {
    if (m.playerGoals > m.oppGoals) return END.WIN;
    if (m.playerGoals < m.oppGoals) return END.LOSS;
    return null; // 平局 -> 进入骤死
  }
  return null;
}

/** 骤死赛：每组双方各罚一球，结果不同即分出胜负 */
function decideSuddenDeath(m) {
  // 只在一组完整结束（双方都罚过）后判定
  if (m.playerTaken !== m.oppTaken) return null;
  if (m.playerGoals > m.oppGoals) return END.WIN;
  if (m.playerGoals < m.oppGoals) return END.LOSS;
  if (m.sdSet >= SUDDEN_DEATH_SETS) return END.DRAW;
  return null;
}

/** 当前状态是否已终局（纯函数，不修改入参） */
function evaluateEnd(m) {
  if (m.ended) return m.ended;
  return m.suddenDeath ? decideSuddenDeath(m) : decideRegular(m);
}

/** 应用一次进攻结果，返回新的比赛状态 */
function applyAttack(m, scored) {
  const next = { ...m, playerTaken: m.playerTaken + 1 };
  if (scored) next.playerGoals = m.playerGoals + 1;
  const end = evaluateEnd(next);
  if (end) {
    next.ended = end;
    return next;
  }
  next.phase = PHASE.DEFEND;
  return next;
}

/** 应用一次防守结果（saved=true 表示扑出，对手未进） */
function applyDefend(m, saved) {
  const next = { ...m, oppTaken: m.oppTaken + 1 };
  if (!saved) next.oppGoals = m.oppGoals + 1;
  const end = evaluateEnd(next);
  if (end) {
    next.ended = end;
    return next;
  }
  // 本轮结束，推进到下一轮
  if (next.suddenDeath) {
    next.sdSet = next.sdSet + 1;
    const sdEnd = decideSuddenDeath(next);
    if (sdEnd) {
      next.ended = sdEnd;
      return next;
    }
    next.phase = PHASE.ATTACK;
    return next;
  }
  if (next.playerTaken >= REGULAR_ROUNDS && next.oppTaken >= REGULAR_ROUNDS) {
    // 常规赛打完且平局 -> 骤死
    next.suddenDeath = true;
    next.sdSet = 1;
    next.phase = PHASE.ATTACK;
    return next;
  }
  next.round = next.round + 1;
  next.phase = PHASE.ATTACK;
  return next;
}

/**
 * 预判某个动作结果会把比赛带向哪里。
 * 这是现金模型的关键输入：若失败分支即为常规落败，该分支必须让现金归零。
 */
function previewOutcomes(m) {
  if (m.phase === PHASE.ATTACK) {
    return {
      success: applyAttack(m, true),
      failure: applyAttack(m, false),
    };
  }
  return {
    success: applyDefend(m, true),
    failure: applyDefend(m, false),
  };
}

/** 剩余罚球数（含骤死显示） */
function remainingShots(m) {
  if (m.suddenDeath) {
    return { player: 1, opp: m.playerTaken > m.oppTaken ? 1 : 1 };
  }
  return regularRemaining(m);
}

/**
 * 关键球情境（D4）。按剩余次数计算，普通进球不得误标为必胜。
 * 情境本身不添加任何隐藏概率或额外奖金。
 */
function keyBall(m) {
  const pv = previewOutcomes(m);
  if (m.phase === PHASE.ATTACK) {
    if (pv.success.ended === END.WIN) return { kind: 'winChance', text: '这一球进，就赢下大战' };
    if (pv.failure.ended === END.LOSS) return { kind: 'mustScore', text: '必须罚进，才能继续' };
    if (m.oppGoals > m.playerGoals) return { kind: 'equalize', text: '罚进可把比分追平' };
    if (m.suddenDeath) return { kind: 'sudden', text: '骤死赛：本组双方结果不同就分出胜负' };
    return null;
  }
  if (pv.failure.ended === END.LOSS) return { kind: 'mustSave', text: '必须扑出，才能继续' };
  if (pv.success.ended === END.WIN) return { kind: 'saveToWin', text: '扑出这球，就赢下大战' };
  if (m.suddenDeath) return { kind: 'sudden', text: '骤死赛：扑出即取胜，失球即落败' };
  return null;
}


/* ======== src/math/keeper.js ======== */
// 门将原型、赛前倾向与有限记忆（S1-1 ~ S1-4）
//
// 设计约束：
// - 赛前倾向在第一轮即可展示，解决「首轮无数据」的问题
// - 本场记录与赛前倾向分开显示，并显示样本数量
// - 记忆有衰减且偏移有上限，重复不会让某个方向永久不可用
// - 不同原型的学习与衰减速度不同
const DIRS = ['L', 'C', 'R'];
const DIR_LABEL = { L: '左', C: '中', R: '右' };

/**
 * 三种门将原型。
 * learn  —— 记忆更新速度
 * decay  —— 早期记录的衰减速度（越小衰减越快）
 * memW   —— 扑救方向里「本场记忆」相对「赛前倾向」的权重
 * cap    —— 单个方向的猜中概率上限，防止某方向被永久封死
 */
const ARCHETYPES = {
  anticipator: {
    id: 'anticipator',
    name: '预判型',
    desc: '关注最近射门方向，容易提前移动',
    learn: 1.0,
    decay: 0.55,
    memW: 0.72,
    cap: 0.62,
  },
  reactor: {
    id: 'reactor',
    name: '反应型',
    desc: '较少提前移动，不同射法有不同应对表现',
    learn: 0.45,
    decay: 0.75,
    memW: 0.38,
    cap: 0.50,
  },
  stubborn: {
    id: 'stubborn',
    name: '固执型',
    desc: '初始方向偏好明显，调整较慢',
    learn: 0.3,
    decay: 0.9,
    memW: 0.25,
    cap: 0.58,
  },
};

/** 归一化一个三方向分布 */
function normalize(w) {
  const s = w.L + w.C + w.R;
  return { L: w.L / s, C: w.C / s, R: w.R / s };
}

/** 从 PRF 导出一个确定性的赛前倾向（不同 seed 得到不同对手） */
function makePreMatchTendency(rand) {
  const raw = { L: 0.6 + rand() * 1.4, C: 0.5 + rand() * 1.0, R: 0.6 + rand() * 1.4 };
  return normalize(raw);
}

/** 初始的空记忆 */
function initialMemory() {
  return { L: 0, C: 0, R: 0, samples: 0, history: [] };
}

/**
 * 记录玩家一次射门方向。进球、被扑、打偏均留下记录。
 * 先对已有记录做衰减，再加入新记录 —— 所以最近的权重更高。
 */
function rememberShot(memory, archetype, dir) {
  const a = ARCHETYPES[archetype];
  const next = {
    L: memory.L * a.decay,
    C: memory.C * a.decay,
    R: memory.R * a.decay,
    samples: memory.samples + 1,
    history: [...memory.history, dir],
  };
  next[dir] += a.learn;
  return next;
}

/**
 * 门将的扑救方向分布 = 赛前倾向 与 本场记忆 的加权混合。
 * 每个方向的概率设上限 cap，保证重复不会让该方向永久不可用。
 */
function keeperDiveDistribution(preMatch, memory, archetype) {
  const a = ARCHETYPES[archetype];
  const memTotal = memory.L + memory.C + memory.R;
  let blended;
  if (memTotal <= 0) {
    blended = { ...preMatch };
  } else {
    const mem = normalize({ L: memory.L, C: memory.C, R: memory.R });
    // 记忆权重随样本量上升，但不超过 memW
    const w = a.memW * Math.min(1, memory.samples / 3);
    blended = {
      L: preMatch.L * (1 - w) + mem.L * w,
      C: preMatch.C * (1 - w) + mem.C * w,
      R: preMatch.R * (1 - w) + mem.R * w,
    };
  }
  // 施加上限并把溢出量按比例分给其他方向
  const capped = { ...blended };
  let overflow = 0;
  for (const d of DIRS) {
    if (capped[d] > a.cap) {
      overflow += capped[d] - a.cap;
      capped[d] = a.cap;
    }
  }
  if (overflow > 0) {
    const room = DIRS.filter((d) => capped[d] < a.cap);
    const roomTotal = room.reduce((s, d) => s + (a.cap - capped[d]), 0);
    if (roomTotal > 0) {
      for (const d of room) capped[d] += overflow * ((a.cap - capped[d]) / roomTotal);
    }
  }
  return normalize(capped);
}

/**
 * 可见线索：把门将当前倾向转成一句玩家能读的话。
 * 线索的生成过程与实际概率一致 —— 不是装饰。
 */
function keeperHint(dist, memory) {
  const top = DIRS.reduce((best, d) => (dist[d] > dist[best] ? d : best), 'L');
  const spread = Math.max(dist.L, dist.C, dist.R) - Math.min(dist.L, dist.C, dist.R);
  if (memory.samples === 0) {
    return `赛前情报：门将偏向${DIR_LABEL[top]}侧（本场尚无记录）`;
  }
  if (spread < 0.08) return `门将站位居中，暂无明显偏向（本场 ${memory.samples} 次记录）`;
  const strength = spread > 0.25 ? '明显' : '略微';
  return `门将${strength}偏向${DIR_LABEL[top]}侧（本场 ${memory.samples} 次记录）`;
}

/** 对手射手的方向倾向（玩家防守时可读，D1 的防守侧信息） */
function makeShooterTendency(rand) {
  const raw = { L: 0.6 + rand() * 1.5, C: 0.4 + rand() * 0.9, R: 0.6 + rand() * 1.5 };
  return normalize(raw);
}


/* ======== src/math/actions.js ======== */
// 动作、条件概率与现金分支（S0-3 / S0-4 / S0-5）
//
// ============================================================
// 这是整个项目的承重墙，改动前请先读懂。
// ============================================================
//
// 现金价值 C 必须是鞅：对每个可达决策状态 s 与每个合法继续动作 a，
//
//     C(s) = Σ P(s' | s, a) × C(s')
//
// 本实现不靠「调参后再用蒙特卡洛检验」，而是让每一步在构造上就是一次公平投注：
//
//     成功 -> C × (1 + u)        失败 -> C × (1 - d)
//     要求 p·u = (1 - p)·d       =>    u = d · (1 - p) / p
//
// 代入即得   p(1+u) + (1-p)(1-d) = 1   恒等成立。
//
// 于是：
//  - 任何策略的期望返还都等于初始现金 C(s₀) = W × r，所以 Vmax = Vmin = W × r
//  - 现金可以下降（d > 0 恒成立），不存在「继续严格优于收钱」的无损区间
//  - 玩家选择改变的是 p 与波动形态，不是期望值
//
// 关键不变量：报价里的 p 必须与结算时使用的 p 完全一致。
// 因此 engine 先生成 quote，再用同一个 quote 对象去判定结果。


// 概率被夹在该区间内。下限保证全押分支的赔付上界有限：
// d = 1 时 u = (1-p)/p，p ≥ 0.20 则 u ≤ 4。
const P_MIN = 0.20;
const P_MAX = 0.93;
const SHOT_TYPES = {
  placed: { id: 'placed', name: '推射', accOther: 0.94, beatSame: 0.22, risk: 0.30 },
  driven: { id: 'driven', name: '抽射', accOther: 0.78, beatSame: 0.46, risk: 0.55 },
};
const DEFENSE = { saveMatch: 0.78, saveMiss: 0.07, risk: 0.32 };

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

/**
 * 公平投注的现金分支。
 * @param {number} cash 当前现金价值
 * @param {number} p 本动作的成功概率（已夹紧）
 * @param {number} risk 失败时损失的现金比例；若失败分支即为落败终局则强制为 1
 * @param {boolean} failureIsLoss 失败分支是否直接导致常规落败
 */
function cashBranches(cash, p, risk, failureIsLoss) {
  const d = failureIsLoss ? 1 : risk;
  const u = (d * (1 - p)) / p;
  return {
    p,
    lossFraction: d,
    gainFraction: u,
    onSuccess: cash * (1 + u),
    onFailure: cash * (1 - d),
  };
}

/** 进攻：6 种组合（3 方向 × 2 射法） */
function attackOptions(match, cash, keeperDist) {
  const pv = previewOutcomes(match);
  const failureIsLoss = pv.failure.ended === END.LOSS;
  const successEnds = pv.success.ended;
  const options = [];
  for (const dir of DIRS) {
    const guess = keeperDist[dir];
    for (const t of Object.values(SHOT_TYPES)) {
      const raw = (1 - guess) * t.accOther + guess * t.beatSame;
      const p = clamp(raw, P_MIN, P_MAX);
      options.push({
        kind: PHASE.ATTACK,
        dir,
        shot: t.id,
        id: `${dir}-${t.id}`,
        keeperGuessProb: guess,
        ...cashBranches(cash, p, t.risk, failureIsLoss),
        failureIsLoss,
        successEnds,
      });
    }
  }
  return options;
}

/** 防守：3 个扑救方向 */
function defenseOptions(match, cash, shooterTendency) {
  const pv = previewOutcomes(match);
  const failureIsLoss = pv.failure.ended === END.LOSS;
  const successEnds = pv.success.ended;
  return DIRS.map((dive) => {
    const raw = DIRS.reduce(
      (acc, d) => acc + shooterTendency[d] * (d === dive ? DEFENSE.saveMatch : DEFENSE.saveMiss),
      0
    );
    const p = clamp(raw, P_MIN, P_MAX);
    return {
      kind: PHASE.DEFEND,
      dir: dive,
      id: `dive-${dive}`,
      shooterProb: shooterTendency[dive],
      ...cashBranches(cash, p, DEFENSE.risk, failureIsLoss),
      failureIsLoss,
      successEnds,
    };
  });
}

/** 当前阶段的全部合法动作 */
function legalOptions(match, cash, ctx) {
  if (match.phase === PHASE.ATTACK) {
    const dist = keeperDiveDistribution(ctx.preMatchTendency, ctx.memory, ctx.archetype);
    return { options: attackOptions(match, cash, dist), keeperDist: dist };
  }
  return { options: defenseOptions(match, cash, ctx.shooterTendency), keeperDist: null };
}

/**
 * 自检：任一动作的期望现金必须等于当前现金。
 * 这是 S0-8「无损继续区间」门禁的逐动作版本，engine 每次生成报价时都会调用。
 */
function assertMartingale(cash, options, tolerance = 1e-9) {
  for (const o of options) {
    const ev = o.p * o.onSuccess + (1 - o.p) * o.onFailure;
    if (Math.abs(ev - cash) > tolerance * Math.max(1, Math.abs(cash))) {
      throw new Error(
        `鞅条件被破坏：动作 ${o.id} 的期望现金 ${ev} != 当前现金 ${cash}（差 ${ev - cash}）`
      );
    }
  }
  return true;
}


/* ======== src/math/contract.js ======== */
// 数据契约（SV-2）
//
// 这些结构就是将来服务端要下发的东西。阶段一由 LocalProvider 在本地产出，
// 但形状必须与服务端一致，否则后期接入要返工。
//
// 客户端只负责「呈现 RoundResolution」，不自行计算权威结果。
const CONFIG_VERSION = 'psc-0.1.0-s0s1';

/** @typedef {object} ShootoutConfig */
function makeConfig(overrides = {}) {
  return {
    configVersion: CONFIG_VERSION,
    targetRtp: 0.96,
    regularRounds: 5,
    suddenDeathSets: 3,
    // 返还是否包含本金：本实现的「返还」即为派发给玩家的金额，已含本金部分
    returnIncludesStake: true,
    // 金额舍入：对外展示与结算都用 2 位小数
    amountDecimals: 2,
    drawReturnFactor: 1.0, // 骤死上限后仍平：按当前现金价值全额返还
    ...overrides,
  };
}

/** 四舍五入到配置精度 */
function roundAmount(v, config) {
  const f = 10 ** config.amountDecimals;
  return Math.round(v * f) / f;
}

/**
 * MatchState 对外快照：比分、双方剩余次数、阶段、现金价值、
 * 公开线索、记忆、已用调整次数、终局状态。
 */
function snapshotState(engine) {
  const m = engine.match;
  return {
    configVersion: engine.config.configVersion,
    stateVersion: engine.stateVersion,
    round: m.round,
    phase: m.phase,
    playerGoals: m.playerGoals,
    oppGoals: m.oppGoals,
    playerTaken: m.playerTaken,
    oppTaken: m.oppTaken,
    suddenDeath: m.suddenDeath,
    sdSet: m.sdSet,
    ended: m.ended,
    cashValue: roundAmount(engine.cash, engine.config),
    stake: engine.stake,
    adjustmentsUsed: 0, // 教练调整属 S2，首版恒为 0
    settled: Boolean(engine.settlement),
  };
}


/* ======== src/math/engine.js ======== */
// 比赛引擎：轮次状态机 + 报价 + 权威结算
//
// 职责边界：
//  - 本模块产出 DecisionQuote 与 RoundResolution，是唯一的权威来源
//  - 表现层只呈现结果，不计算任何权威数值
//  - 同一动作重复提交只产生一次有效结果（幂等）
//  - 收钱与继续竞争时只接受一个合法状态转换





const ARCHETYPE_IDS = Object.keys(ARCHETYPES);
class ShootoutEngine {
  /**
   * @param {object} opts
   * @param {number} opts.stake 下注额
   * @param {string} [opts.seed] 阶段一本地生成；服务端接入后由服务端生成
   * @param {object} [opts.config]
   */
  constructor({ stake, seed, config } = {}) {
    this.config = makeConfig(config);
    this.stake = stake;
    this.seed = seed ?? makeLocalSeed();
    this.commitment = commitment(this.seed);
    this.match = initialMatch();

    // 初始现金价值 = W × r。鞅条件保证任何策略的期望返还都等于这个数。
    this.cash = stake * this.config.targetRtp;

    // 对手由 seed 决定，所以同一个 seed 永远得到同一个对手
    let n = 0;
    const r = () => prf(this.seed, `setup:${n++}`);
    this.archetype = ARCHETYPE_IDS[Math.floor(r() * ARCHETYPE_IDS.length)];
    this.preMatchTendency = makePreMatchTendency(r);
    this.shooterTendency = makeShooterTendency(r);

    this.memory = initialMemory();
    this.stateVersion = 0;
    this.quote = null;
    this.log = [];
    this.settlement = null;
    this.events = [];

    this.#issueQuote();
  }

  /** 决策路径：玩家的选择决定读取随机性的哪一条分支 */
  #decisionPath() {
    const prior = this.log.map((e) => e.actionId).join('>');
    const m = this.match;
    const tag = m.suddenDeath ? `sd${m.sdSet}` : `r${m.round}`;
    return `${tag}:${m.phase}:${prior}`;
  }

  /** 生成当前阶段的报价。每次生成都做一次鞅自检。 */
  #issueQuote() {
    if (this.match.ended) {
      this.quote = null;
      return;
    }
    const ctx = {
      preMatchTendency: this.preMatchTendency,
      shooterTendency: this.shooterTendency,
      memory: this.memory,
      archetype: this.archetype,
    };
    const { options, keeperDist } = legalOptions(this.match, this.cash, ctx);
    assertMartingale(this.cash, options);
    this.stateVersion += 1;
    this.quote = {
      quoteId: `q${this.stateVersion}-${this.#decisionPath()}`,
      stateVersion: this.stateVersion,
      configVersion: this.config.configVersion,
      phase: this.match.phase,
      cashValue: this.cash,
      options,
      keeperDist,
      keeperHint:
        this.match.phase === PHASE.ATTACK ? keeperHint(keeperDist, this.memory) : null,
      keyBall: keyBall(this.match),
      canCashOut: this.#canCashOut(),
    };
  }

  /** 收钱窗口：非终局的完整攻防轮结束后。首版的轮末即进攻阶段开始前。 */
  #canCashOut() {
    const m = this.match;
    if (m.ended) return false;
    if (m.phase !== PHASE.ATTACK) return false;
    // 第一轮还没打，不允许立刻兑现
    return m.playerTaken > 0 && m.playerTaken === m.oppTaken;
  }

  /** 对外状态快照 */
  getState() {
    return snapshotState(this);
  }

  getQuote() {
    return this.quote;
  }

  getPublicInfo() {
    const a = ARCHETYPES[this.archetype];
    return {
      archetype: a.id,
      archetypeName: a.name,
      archetypeDesc: a.desc,
      preMatchTendency: this.preMatchTendency,
      shooterTendency: this.shooterTendency,
      memory: {
        L: this.memory.L,
        C: this.memory.C,
        R: this.memory.R,
        samples: this.memory.samples,
        history: [...this.memory.history],
      },
      remaining: remainingShots(this.match),
      commitment: this.commitment,
    };
  }

  /**
   * 提交一个动作。必须带上报价 ID —— 这保证结算使用的 p 与玩家看到的 p 完全一致。
   * 幂等：同一个报价 ID 只能成功提交一次。
   */
  submit(actionId, quoteId) {
    if (this.settlement) throw new Error('已结算，不接受新动作');
    if (!this.quote) throw new Error('当前无可提交的报价');
    if (quoteId !== this.quote.quoteId) {
      // 幂等保护：重复提交旧报价不产生第二次效果
      const already = this.log.find((e) => e.quoteId === quoteId);
      if (already) return already.resolution;
      throw new Error('报价已过期，请使用当前报价');
    }
    const option = this.quote.options.find((o) => o.id === actionId);
    if (!option) throw new Error(`非法动作：${actionId}`);

    const path = `${this.#decisionPath()}|${actionId}`;
    const draw = prf(this.seed, path);
    const success = draw < option.p;

    const before = {
      cash: this.cash,
      playerGoals: this.match.playerGoals,
      oppGoals: this.match.oppGoals,
    };

    // 现金按报价里的分支推进 —— 不重新计算概率
    this.cash = success ? option.onSuccess : option.onFailure;

    let newHint = null;
    if (this.match.phase === PHASE.ATTACK) {
      // 门将记住这次射门方向（进球、被扑、打偏均留下记录）
      this.memory = rememberShot(this.memory, this.archetype, option.dir);
      this.match = applyAttack(this.match, success);
      const dist = keeperDiveDistribution(this.preMatchTendency, this.memory, this.archetype);
      newHint = keeperHint(dist, this.memory);
    } else {
      this.match = applyDefend(this.match, success);
    }

    if (this.match.ended === END.LOSS) this.cash = 0;

    const resolution = {
      stateVersion: this.stateVersion,
      quoteId,
      phase: option.kind,
      actionId,
      dir: option.dir,
      shot: option.shot ?? null,
      probability: option.p,
      success,
      cashBefore: roundAmount(before.cash, this.config),
      cashAfter: roundAmount(this.cash, this.config),
      score: { player: this.match.playerGoals, opp: this.match.oppGoals },
      scoreChanged:
        this.match.playerGoals !== before.playerGoals || this.match.oppGoals !== before.oppGoals,
      newHint,
      keyBall: this.match.ended ? null : keyBall(this.match),
      nextPhase: this.match.ended ? null : this.match.phase,
      endType: this.match.ended,
    };

    this.log.push({ quoteId, actionId, resolution });
    this.events.push({
      seq: this.log.length,
      kind: option.kind,
      dir: option.dir,
      shot: option.shot ?? null,
      success,
      probability: option.p,
      score: { ...resolution.score },
      cashAfter: resolution.cashAfter,
      keeperSamples: this.memory.samples,
    });

    if (this.match.ended) {
      this.#settle(this.match.ended);
    } else {
      this.#issueQuote();
    }
    return resolution;
  }

  /** 主动收钱。与继续竞争时只接受一个合法状态转换。 */
  cashOut(quoteId) {
    if (this.settlement) return this.settlement;
    if (!this.quote || quoteId !== this.quote.quoteId) throw new Error('报价已过期');
    if (!this.quote.canCashOut) throw new Error('当前不在收钱窗口');
    this.match = { ...this.match, ended: END.CASHED };
    return this.#settle(END.CASHED);
  }

  #settle(reason) {
    if (this.settlement) return this.settlement;
    let payout;
    switch (reason) {
      case END.LOSS:
        payout = 0;
        break;
      case END.DRAW:
        payout = this.cash * this.config.drawReturnFactor;
        break;
      case END.WIN:
      case END.CASHED:
      default:
        payout = this.cash;
        break;
    }
    this.quote = null;
    this.settlement = {
      settlementId: `s-${this.commitment}-${this.log.length}`,
      reason,
      stake: this.stake,
      payout: roundAmount(payout, this.config),
      amountUnit: 'MXN',
      settled: true,
      seedRevealed: this.seed,
      commitment: this.commitment,
      configVersion: this.config.configVersion,
      actionLog: this.log.map((e) => e.actionId),
      events: this.events,
    };
    return this.settlement;
  }

  getSettlement() {
    return this.settlement;
  }
}

// OutcomeProvider —— 服务端接入的唯一切换缝（SV-1）
//
// 表现层只通过这个接口拿数据，永远不直接碰 shootout-math。
// 阶段一用 LocalProvider（本地 seed + 本地 PRF）；

//

//   - 收钱与继续竞争时只接受一个合法状态转换

/** @interface */
class OutcomeProvider {

    throw new Error('未实现');

    throw new Error('未实现');

    throw new Error('未实现');

/* ======== src/providers/localProvider.js ======== */
// LocalProvider —— 阶段一的本地模拟实现
//
// 它守住的是服务端契约，不是便利性：方法签名、返回结构、幂等与竞态语义
// 都与将来的 RemoteProvider 一致。所以接服务端时表现层零改动。
//
// 刻意保留的异步签名：即使本地是同步计算，也返回 Promise，
// 这样表现层从第一版起就按「等待权威结果」的方式写，不会隐含同步假设。
class LocalProvider extends OutcomeProvider {
  constructor({ seed } = {}) {
    super();
    this.seedOverride = seed;
    this.engine = null;
  }

  async start({ stake }) {
    this.engine = new ShootoutEngine({ stake, seed: this.seedOverride });
    return {
      state: this.engine.getState(),
      quote: this.engine.getQuote(),
      info: this.engine.getPublicInfo(),
    };
  }

  async submit(actionId, quoteId) {
    const resolution = this.engine.submit(actionId, quoteId);
    return {
      resolution,
      state: this.engine.getState(),
      quote: this.engine.getQuote(),
      info: this.engine.getPublicInfo(),
      settlement: this.engine.getSettlement(),
    };
  }

  async cashOut(quoteId) {
    const settlement = this.engine.cashOut(quoteId);
    return { settlement, state: this.engine.getState() };
  }

  getState() {
    return this.engine ? this.engine.getState() : null;
  }
}


/* ======== src/ui/app.js ======== */
// 表现层 —— 首版程序化占位美术
//
// 边界：本文件不含任何游戏逻辑与权威计算。
// 它只做三件事：把 provider 返回的报价画出来、收集玩家选择、呈现 RoundResolution。
// 按架构约定，整层可在 S3 替换为 Pixi + 视频基座而不影响 shootout-math。



const STAKES = [5, 10, 20, 50];
const MONEY = (v) => v.toFixed(2);

const el = (tag, cls, html) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
};
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/** 动画播放期间禁用所有动作按钮，避免重复提交 */
function disableOptions() {
  for (const b of document.querySelectorAll('.opt, .btn.cash')) b.disabled = true;
}

const state = {
  provider: null,
  stake: 10,
  shotType: 'placed',
  quote: null,
  match: null,
  info: null,
  settlement: null,
  busy: false,
  screen: 'bet',
  lastResolution: null,
  history: [],
  prevKeeperDist: null, // 上一次进攻时的门将倾向，用于显示记忆带来的变化
};

const root = document.getElementById('app');

// ---------------------------------------------------------------- 渲染

function render() {
  root.innerHTML = '';
  const head = el('div', 'full');
  head.appendChild(el('h1', null, '点球大赛 <span style="color:var(--dim);font-weight:400;font-size:13px">Tanda de Penales</span>'));
  head.appendChild(
    el('div', 'sub', '首版灰盒 · S0+S1 · 程序化占位美术 · 本地模拟（服务端后期接入）')
  );
  root.appendChild(head);

  if (state.screen === 'bet') return renderBet();
  if (state.screen === 'settled') return renderSettled();
  renderPlay();
}

function renderBet() {
  const c = el('div', 'card');
  c.appendChild(el('h2', null, '选择下注额（MXN）'));
  const row = el('div', 'stakes');
  for (const s of STAKES) {
    const b = el('button', state.stake === s ? 'on' : null, String(s));
    b.onclick = () => {
      state.stake = s;
      render();
    };
    row.appendChild(b);
  }
  c.appendChild(row);
  c.appendChild(
    el(
      'div',
      'note',
      `目标 RTP 96%。开局可兑现金额为 <b style="color:var(--accent)">${MONEY(
        state.stake * 0.96
      )}</b>，之后随每次结果上下浮动 —— 任何打法的期望返还都等于这个数，你选择的是波动形态而不是期望值。`
    )
  );
  const go = el('button', 'btn primary', '开始点球大战');
  go.onclick = startMatch;
  c.appendChild(go);
  root.appendChild(c);

  const rules = el('div', 'card');
  rules.appendChild(el('h2', null, '规则'));
  rules.appendChild(
    el(
      'div',
      'gate',
      `常规赛最多 <b>5 轮</b>，每轮你先罚球再扑救。<br>
       提前锁定胜负即终局。平局进入 <b>限定骤死赛（最多 3 组）</b>，仍平则按当前可兑现金额全额返还。<br>
       收钱窗口在每个完整攻防轮结束后。<br>
       <b>常规落败返还为零</b> —— 此前每次报价都已把该风险计入。<br>
       首版不含压力、阵容、教练调整、快速模式与双倍罚球。`
    )
  );
  root.appendChild(rules);

  const gates = el('div', 'card');
  gates.appendChild(el('h2', null, '本版已通过的数学门禁'));
  gates.appendChild(
    el(
      'div',
      'gate',
      `<b>S0-7</b> 完整状态求解：穷举 1,850,400 个状态，Vmax = Vmin = W×r（偏差 1.2e-14）<br>
       <b>S0-8</b> 无损继续区间：97,020 个收钱窗口、2,141,208 个动作，0 处「继续严格优于收钱」<br>
       <b>S0-9</b> 蒙特卡洛回归：14 组策略 × 6 万局，RTP 全部落在目标置信区间内<br>
       <b>单元测试</b> 28 项全通过（PRF 决定性、幂等、竞态、终局表、记忆上限）`
    )
  );
  root.appendChild(gates);
}

function pips(taken, goals, total) {
  const wrap = el('span', 'pips');
  for (let i = 0; i < total; i++) {
    const p = el('span', 'pip');
    if (i < taken) p.classList.add(i < goals ? 'goal' : 'miss');
    wrap.appendChild(p);
  }
  return wrap;
}

function renderPlay() {
  const m = state.match;
  const q = state.quote;
  const info = state.info;

  // ---- HUD
  const hud = el('div', 'card');
  const grid = el('div', 'hud');
  const mk = (lbl, val, cls) => {
    const b = el('div', 'box');
    b.appendChild(el('div', 'lbl', lbl));
    b.appendChild(el('div', `val ${cls ?? ''}`, val));
    return b;
  };
  grid.appendChild(mk('比分', `${m.playerGoals} <small>:</small> ${m.oppGoals}`));
  grid.appendChild(
    mk('可兑现', `${MONEY(m.cashValue)}`, 'cash')
  );
  grid.appendChild(
    mk('轮次', m.suddenDeath ? `骤死 ${m.sdSet}/3` : `${m.round}<small>/5</small>`)
  );
  hud.appendChild(grid);

  const shots = el('div', 'shots');
  const me = el('span', null, '你 ');
  me.appendChild(pips(m.playerTaken, m.playerGoals, m.suddenDeath ? m.playerTaken : 5));
  const opp = el('span', null, '对手 ');
  opp.appendChild(pips(m.oppTaken, m.oppGoals, m.suddenDeath ? m.oppTaken : 5));
  shots.appendChild(me);
  shots.appendChild(opp);
  hud.appendChild(shots);
  root.appendChild(hud);

  // ---- 球门
  const pitchCard = el('div', 'card');
  pitchCard.appendChild(buildPitch());
  // 关键球
  if (q?.keyBall) pitchCard.appendChild(el('div', 'keyball', `⚡ ${q.keyBall.text}`));
  // 线索
  if (q?.phase === 'attack') {
    pitchCard.appendChild(el('div', 'hint', `👁 ${q.keeperHint}`));
  } else if (q) {
    pitchCard.appendChild(
      el('div', 'hint', `👁 对手射手倾向如下（赛前情报 · 本场已罚 ${m.oppTaken} 次）`)
    );
  }
  root.appendChild(pitchCard);

  // ---- 动作
  if (q) root.appendChild(buildActions(q, info));

  // ---- 倾向图
  root.appendChild(buildTendency(q, info));

  // ---- 日志
  if (state.history.length) {
    const lg = el('div', 'card');
    lg.appendChild(el('h2', null, '本场记录'));
    const box = el('div', 'log');
    for (const h of [...state.history].reverse()) box.appendChild(el('div', null, h));
    lg.appendChild(box);
    root.appendChild(lg);
  }
}

function buildPitch() {
  const p = el('div', 'pitch');
  const frame = el('div', 'goalframe');
  const zones = el('div', 'zones');
  const q = state.quote;
  const dist = q?.keeperDist;
  for (const d of DIRS) {
    const z = el('div', 'zone');
    const heat = el('div', 'heat');
    if (dist) heat.style.opacity = String(Math.min(0.55, Math.max(0, (dist[d] - 0.2) * 1.5)));
    z.appendChild(heat);
    if (dist) z.appendChild(el('div', 'pct', `${Math.round(dist[d] * 100)}%`));
    zones.appendChild(z);
  }
  frame.appendChild(zones);
  p.appendChild(frame);

  const keeper = el('div', 'keeper');
  keeper.id = 'keeper';
  frame.appendChild(keeper);

  const ball = el('div', 'ball');
  ball.id = 'ball';
  p.appendChild(ball);
  p.appendChild(el('div', 'spot'));

  const banner = el('div', 'banner');
  banner.id = 'banner';
  p.appendChild(banner);
  return p;
}

function buildActions(q, info) {
  const c = el('div', 'card');
  if (q.phase === 'attack') {
    c.appendChild(el('h2', null, '进攻 · 选择方向与射法'));
    const tr = el('div', 'typeRow');
    for (const t of Object.values(SHOT_TYPES)) {
      const b = el(
        'button',
        state.shotType === t.id ? 'on' : null,
        `${t.name}<span style="font-size:11px;color:var(--dim)"> · 风险 ${Math.round(t.risk * 100)}%</span>`
      );
      b.onclick = () => {
        state.shotType = t.id;
        render();
      };
      tr.appendChild(b);
    }
    c.appendChild(tr);

    const opts = el('div', 'opts cols3');
    for (const d of DIRS) {
      const o = q.options.find((x) => x.dir === d && x.shot === state.shotType);
      opts.appendChild(optButton(o, DIR_LABEL[d], q));
    }

    c.appendChild(
      el(
        'div',
        'note',
        '门将会记住你罚过的方向。重复同一侧会被盯上 —— 命中率下降，但赔付同步上升，期望值不变。'
      )
    );
  } else {
    c.appendChild(el('h2', null, '防守 · 选择扑救方向'));
    const opts = el('div', 'opts cols3');
    for (const d of DIRS) {
      const o = q.options.find((x) => x.dir === d);
      opts.appendChild(
        optButton(o, DIR_LABEL[d], q, `对手 ${Math.round((o?.shooterProb ?? 0) * 100)}%`)
      );
    }

    c.appendChild(
      el('div', 'note', '扑对方向概率高但赔付低；扑冷门概率低但赔付高。两者期望值相同。')
    );
  }

  if (q.canCashOut) {
    const row = el('div', 'btnRow');
    const cash = el('button', 'btn cash', `收钱 ${MONEY(q.cashValue)}`);
    cash.onclick = doCashOut;
    const cont = el('button', 'btn ghost', '继续比赛');
    cont.onclick = () => {
      /* 继续就是直接选动作，这里只作说明 */
    };

    cont.style.opacity = '.6';

function optButton(o, label, q, extra) {
  const b = el('button', 'opt' + (o?.failureIsLoss ? ' allin' : ''));
  b.appendChild(el('div', 'dir', label));
  b.appendChild(el('div', 'p', `${(o.p * 100).toFixed(0)}%`));
  const br = el('div', 'br');
  br.innerHTML =
    `<b>成 ${MONEY(o.onSuccess)}</b><br><i>败 ${MONEY(o.onFailure)}${
      o.failureIsLoss ? ' 全失' : ''
    }</i>` + (extra ? `<br><span style="color:#7e8fa6">${extra}</span>` : '');
  b.appendChild(br);
  b.disabled = state.busy;
  b.onclick = () => doSubmit(o.id, q.quoteId);
  return b;
}

function buildTendency(q, info) {
  const c = el('div', 'card');
  const isAttack = q?.phase === 'attack';
  c.appendChild(
    el('h2', null, isAttack ? '门将倾向（赛前情报 + 本场记录）' : '对手射手倾向（赛前情报）')
  );
  const dist = isAttack ? q.keeperDist : info.shooterTendency;
  const prev = isAttack ? state.prevKeeperDist : null;
  const top = DIRS.reduce((a, d) => (dist[d] > dist[a] ? d : a), 'L');
  const row = el('div', 'tend');
  for (const d of DIRS) {
    const t = el('div', 't' + (d === top ? ' hot' : ''));
    t.appendChild(el('div', 'd', DIR_LABEL[d]));
    const bar = el('div', 'bar');
    const span = el('span');
    span.style.width = `${Math.round(dist[d] * 100)}%`;
    bar.appendChild(span);
    t.appendChild(bar);
    const pct = Math.round(dist[d] * 100);
    let deltaHtml = '';
    if (prev) {
      const dp = pct - Math.round(prev[d] * 100);
      if (dp !== 0) {
        const up = dp > 0;
        deltaHtml = `<span class="delta ${up ? 'up' : 'down'}">${up ? '▲' : '▼'}${Math.abs(dp)}</span>`;
      }
    }
    t.appendChild(el('div', 'v', `${pct}%${deltaHtml}`));
    row.appendChild(t);
  }
  c.appendChild(row);
  if (isAttack && prev) {
    c.appendChild(
      el('div', 'note', '▲▼ 表示相对你上一次罚球时的变化 —— 门将记忆正在生效。')
    );
  }

  const a = info;
  c.appendChild(
    el(
      'div',
      'note',
      isAttack
        ? `对手门将：<b style="color:var(--ink)">${a.archetypeName}</b> —— ${a.archetypeDesc}。` +
            `<br>你的射门记录：${
              a.memory.history.length
                ? a.memory.history.map((h) => DIR_LABEL[h]).join(' → ')
                : '尚无'
            }（${a.memory.samples} 次样本，小样本不代表确定预测）`
        : '赛前情报来自对手配置，第一轮即可使用。本场记录样本较少时不代表确定预测。'
    )
  );
  return c;
}

function buildReport(s) {
  const out = [];
  const ev = s.events;
  const atk = ev.filter((e) => e.kind === 'attack');
  const scored = atk.filter((e) => e.success).length;
  out.push(`本场实际射门 <b>${scored}/${atk.length}</b>，扑救 <b>${ev.filter((e) => e.kind === 'defend' && e.success).length}/${ev.filter((e) => e.kind === 'defend').length}</b>。`);

  // 找出重复方向后的被扑
  const dirs = atk.map((e) => e.dir);
  for (let i = 1; i < atk.length; i++) {
    if (dirs[i] === dirs[i - 1] && !atk[i].success) {
      out.push(
        `你连续两次射向${DIR_LABEL[dirs[i]]}侧，第二次被扑出 —— 重复改变了门将倾向、提高了被扑概率，本次结果仍由随机分支决定。`
      );
      break;
    }
  }
  // 找出变向后的进球
  for (let i = 1; i < atk.length; i++) {
    if (dirs[i] !== dirs[i - 1] && atk[i].success && atk[i].keeperSamples >= 2) {
      out.push(
        `第 ${i + 1} 次射门你从${DIR_LABEL[dirs[i - 1]]}侧改打${DIR_LABEL[dirs[i]]}侧并进球。`
      );
      break;
    }
  }
  const peak = Math.max(...ev.map((e) => e.cashAfter));
  out.push(`本场可兑现金额最高到过 <b>${MONEY(peak)}</b>，最终结算 <b>${MONEY(s.payout)}</b>。`);
  if (s.reason === 'cashed') out.push('你在轮末主动收钱，锁定了当时的可兑现金额。');
  if (s.reason === 'loss') out.push('对手锁定胜局，按规则返还为零 —— 此前每次报价都已计入该风险。');
  return out;
}

// ---------------------------------------------------------------- 动画

// 球门框占 pitch 宽度的 10%~90%，所以三个区域中心对应 pitch 的 28% / 50% / 72%
const BALL_X = { L: '28%', C: '50%', R: '72%' };
// 门将在球门框内，坐标相对框本身
const KEEPER_X = { L: '20%', C: '50%', R: '80%' };

/**
 * 在「当前」DOM 上播放一次结果动画。
 * 必须在重新渲染之前调用 —— 重建 DOM 会丢掉初始样式，CSS 过渡就没有可插值的起点。
 */
async function animate(res) {
  const ball = document.getElementById('ball');
  const keeper = document.getElementById('keeper');
  const banner = document.getElementById('banner');
  if (!ball || !keeper || !banner) return;

  // 回到起点并强制一次重排，保证过渡有起点可插值
  ball.style.transition = 'none';
  ball.style.left = '50%';
  ball.style.bottom = '8px';
  ball.style.opacity = '1';
  void ball.offsetWidth;
  ball.style.transition = '';

  const isAttack = res.phase === 'attack';
  // 进攻：命中则门将扑错方向，被扑则扑对方向
  // 防守：res.dir 是我方扑救方向，命中(扑出)说明对手射向同侧
  const keeperDir = isAttack
    ? res.success
      ? DIRS.filter((d) => d !== res.dir)[0]
      : res.dir
    : res.dir;
  const ballDir = isAttack ? res.dir : res.success ? res.dir : DIRS.filter((d) => d !== res.dir)[0];

  await sleep(30);
  keeper.style.left = KEEPER_X[keeperDir];
  ball.style.left = BALL_X[ballDir];
  if (isAttack) {
    ball.style.bottom = res.success ? '92px' : '64px';
  } else {
    ball.style.bottom = res.success ? '52px' : '92px';
  }
  ball.style.transform = 'translateX(-50%) scale(1.15)';

  await sleep(380);
  banner.textContent = isAttack
    ? res.success
      ? '进球！'
      : '被扑出'
    : res.success
      ? '扑出了！'
      : '对手进球';
  banner.className = `banner show ${res.success ? 'good' : 'bad'}`;

  await sleep(900);
}

// ---------------------------------------------------------------- 交互

async function startMatch() {
  state.provider = new LocalProvider();
  const r = await state.provider.start({ stake: state.stake });
  state.match = r.state;
  state.quote = r.quote;
  state.info = r.info;
  state.settlement = null;
  state.history = [];
  state.prevKeeperDist = null;
  state.screen = 'play';
  render();
}

async function doSubmit(actionId, quoteId) {
  if (state.busy) return;
  state.busy = true;
  try {
    const r = await state.provider.submit(actionId, quoteId);
    const res = r.resolution;
    state.lastResolution = res;

    // 记下本次进攻时的门将倾向，下次进攻界面用它显示记忆带来的变化
    if (res.phase === 'attack' && state.quote?.keeperDist) {
      state.prevKeeperDist = { ...state.quote.keeperDist };
    }

    // 先在当前 DOM 上播完动画，再提交新状态并重绘。
    // 顺序很重要：重绘会重建球门元素，动画就没有插值起点了。
    disableOptions();
    await animate(res);

    state.match = r.state;
    state.info = r.info;
    state.quote = r.quote;

    const label =
      res.phase === 'attack'
        ? `${DIR_LABEL[res.dir]}·${SHOT_TYPES[res.shot]?.name ?? ''}`
        : `扑${DIR_LABEL[res.dir]}`;
    state.history.push(
      `<span class="${res.success ? 'g' : 'b'}">${res.success ? '○' : '×'}</span> ` +
        `${res.phase === 'attack' ? '攻' : '守'} ${label} ` +
        `${(res.probability * 100).toFixed(0)}% · ${MONEY(res.cashBefore)}→${MONEY(res.cashAfter)} · ${res.score.player}:${res.score.opp}`
    );

    if (r.settlement) {
      state.settlement = r.settlement;
      state.screen = 'settled';
    }
  } catch (e) {
    console.error(e);
    alert(`操作失败：${e.message}`);
  } finally {
    // 必须先解除 busy 再重绘：按钮的 disabled 取自 state.busy，
    // 若顺序颠倒会渲染出一屏永久禁用的按钮。
    state.busy = false;
    render();
  }
}

async function doCashOut() {
  if (state.busy) return;
  state.busy = true;
  try {
    const r = await state.provider.cashOut(state.quote.quoteId);
    state.settlement = r.settlement;
    state.match = r.state;
    state.screen = 'settled';
  } catch (e) {
    alert(`收钱失败：${e.message}`);
  } finally {
    state.busy = false;
    render();
  }
}

// 暴露给自动化验证用（不参与游戏逻辑）
window.__psc = {
  state,
  startMatch,
  submit: doSubmit,
  cashOut: doCashOut,
  getQuote: () => state.quote,
};

render();

})();
</script>
</body>
</html>
