<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover puts the scene behind the notch; the layout keeps
         its controls out of it with env(safe-area-inset-*). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#06050a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Browser page translation rewrites the DOM under React and breaks it. -->
    <meta name="google" content="notranslate" />
    <title>The Last Round · A West Texas Wager</title>
    <meta
      name="description"
      content="A western revolver wagering game. Entertainment only - no real money, no wagering, no payouts."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
