name: Deploy preview

# Builds the prototype on this branch and publishes it to the gh-pages branch,
# which GitHub Pages serves at https://<owner>.github.io/<repo>/.
#
# This is a preview only: it never merges and never touches the default branch.
#
# Enabling Pages itself is a one-time manual step, because creating or
# repointing a Pages site needs repository administration scope and the
# Actions token cannot hold it (POST/PUT /repos/{o}/{r}/pages both return 403).
# Settings -> Pages -> Source: "Deploy from a branch" -> gh-pages / (root).
# Once that is set, every push to this branch republishes automatically.

on:
  push:
    branches: ['cursor/western-saloon-roulette-casino-fa3e']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: preview-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: prototype/package-lock.json

      - run: npm ci
        working-directory: prototype

      - run: npm test
        working-directory: prototype

      # A project site is served from /<repo>/, not the domain root.
      - name: Build
        working-directory: prototype
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Add the Pages shims
        run: |
          # No client-side router, but serving the app for unknown paths means
          # a mistyped deep link still boots instead of 404ing.
          cp prototype/dist/index.html prototype/dist/404.html
          # Jekyll is on by default for branch sources and would swallow any
          # path component beginning with an underscore.
          touch prototype/dist/.nojekyll

      - name: Push the build to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd prototype/dist
          git init -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Preview build from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages

      # Best effort only. Expected to 403 until Pages is enabled by hand, so it
      # reports rather than failing the run - the build above is what matters.
      - name: Report Pages status
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/body -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$code" = '200' ]; then
            echo "Pages is live: $(jq -r .html_url /tmp/body)" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '### Pages is not enabled yet'
              echo
              echo 'The build is on the `gh-pages` branch and ready to serve.'
              echo 'Settings -> Pages -> Source: "Deploy from a branch" -> `gh-pages` / `(root)`.'
              echo
              echo "It will then be live at https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
