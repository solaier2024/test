name: Deploy penalty shootout preview

on:
  push:
    branches: [cursor/penalty-shootout-7c4b, codex/penalty-pixi-playcanvas]
  pull_request:
    branches: [main, cursor/penalty-shootout-7c4b]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # 基础枚举与扩展分解证书的覆盖边界见 docs/gameplay-and-performance.md。
      - name: 单元测试
        run: npm test
      - name: 基础比分与方向记忆求解（Vmax = Vmin = W×r）
        run: node tools/solve.js
      - name: 基础收取窗口与无损继续区间检查
        run: node tools/freeroll.js
      - name: 阵容、压力、教练与快速模式的分解 Bellman 验证
        run: node tools/verify-depth.js
      - name: S0-9 蒙特卡洛回归
        run: MC_ROUNDS=20000 node tools/montecarlo.js
      - name: Vite production build
        run: npm run build
      - name: Validate video assets, audio and HTMLPreview compatibility
        run: npm run verify:assets
      - uses: actions/upload-artifact@v4
        with:
          name: penalty-preview
          path: dist

  deploy:
    needs: verify
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/cursor/penalty-shootout-7c4b'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: penalty-preview
          path: dist

      - uses: actions/configure-pages@v5
        with:
          # 若仓库尚未启用 Pages，由本 workflow 的令牌自动启用
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
