<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#090d14" />
    <meta
      name="description"
      content="LAST KICK · 实时 3D 点球大战，观察门将，选择球路，掌控比赛节奏。模拟币演示。"
    />
    <title>LAST KICK · 点球大赛</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      body {
        margin: 0;
        background: #090d14;
      }
      #boot-splash {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 23px;
        background:
          radial-gradient(ellipse at 50% 70%, #562e1b35, transparent 50%),
          #090d14;
        color: #f4f2eb;
        font-family: Impact, "Microsoft YaHei", sans-serif;
      }
      #boot-splash strong {
        font-size: clamp(40px, 7vw, 80px);
        letter-spacing: -1px;
      }
      #boot-splash strong span {
        color: #ffc35a;
      }
      #boot-splash i {
        width: 50px;
        height: 50px;
        border: 1px solid #34404f;
        border-top: 2px solid #ffc35a;
        border-radius: 50%;
        animation: boot-orbit 1.4s linear infinite;
      }
      #boot-splash small {
        font:
          11px "Microsoft YaHei",
          sans-serif;
        color: #aeb8c5;
        letter-spacing: 3px;
      }
      @keyframes boot-orbit {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot-splash" role="status">
        <i aria-hidden="true"></i><strong>LAST <span>KICK.</span></strong
        ><small>全场屏息 · 正在进入球场</small>
      </div>
    </div>
    <script type="module" src="./src/ui/app.js"></script>
    <noscript
      style="
        color: #e8eef7;
        font-family: sans-serif;
        padding: 16px;
        display: block;
      "
    >
      本演示需要启用 JavaScript。
    </noscript>
  </body>
</html>
